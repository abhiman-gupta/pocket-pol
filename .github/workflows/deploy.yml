name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect browser files
        # The headless renderer (render.mjs, headless.mjs) runs in Node and is not part of the site.
        run: |
          mkdir _site
          rsync -a --exclude=README.md --exclude=render.mjs --exclude=headless.mjs web/ _site/
          ls -la _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # GitHub Pages sometimes cannot see a just-uploaded artifact or rejects the deployment
      # ("try again later"). Give the artifact time to register and retry the deploy twice.
      - name: Let the artifact register
        run: sleep 15

      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before the first retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before the last retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120

      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
